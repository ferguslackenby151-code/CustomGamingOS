name: Production OS Compilation Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}
  FEDORA_VERSION: "latest"

jobs:
  build_push:
    name: Compile Core OS and Deploy to Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code Workspace
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Compute Image Target Name
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          name="${IMAGE_NAME,,}"
          echo "image=${REGISTRY}/${owner}/${name}" >> "$GITHUB_OUTPUT"

      - name: Extract Metadata Tags and Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx Environment
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile OS and Push Container Registry Package
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
          provenance: false
          sbom: false
